name: Reviewed anime news delivery

on:
  push:
    branches: [main]
    paths: ['queue/events/**']
  schedule:
    # Queue drain only. Discovery/AI editorial verification lives outside this repo.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず検証する（初期値 true）'
        type: boolean
        default: true

permissions:
  contents: read

# Retain the old concurrency group so an old in-flight RSS run cannot overlap.
concurrency:
  group: anime-news-monitor
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python bot.py --dry-run --mode both

  deliver:
    needs: validate
    if: >-
      vars.DELIVERY_LIVE_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Fetch current branch after queueing/concurrency wait; never a stale event SHA.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Revalidate latest checkout without secrets
        run: |
          python -m unittest discover -s tests -v
          python bot.py --dry-run --mode both
      - name: Deliver approved queue with durable checkpoints
        env:
          # Preserve the existing Discord secret name AND its existing value.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DELIVERY_LIVE_ENABLED: ${{ vars.DELIVERY_LIVE_ENABLED }}
          DELIVERY_BRANCH: ${{ github.event.repository.default_branch }}
          X_ENABLED: ${{ vars.X_ENABLED }}
          X_EXPECTED_USER_ID: ${{ vars.X_EXPECTED_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        shell: bash
        run: |
          mode=discord
          if [[ "$X_ENABLED" == "true" ]]; then mode=both; fi
          python bot.py --live --mode "$mode" --limit 10
      # No final 'success-only save': every transition is committed BEFORE/AFTER
      # its individual API operation by GitCheckpoint. No secrets in artifacts.

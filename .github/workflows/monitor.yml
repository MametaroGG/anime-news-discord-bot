name: Anime news RSS monitor
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずに確認する'
        type: boolean
        default: false
      test_post:
        description: '架空のテスト投稿を1件送る（RSS収集なし）'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: anime-news-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitor feeds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_POST: ${{ inputs.test_post }}
        shell: bash
        run: |
          ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "$TEST_POST" == "true" ]]; then ARGS+=(--test-post); fi
          python bot.py "${ARGS[@]}"
      - name: Persist deduplication state
        if: ${{ success() && inputs.dry_run != true && inputs.test_post != true }}
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/seen.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/seen.json
            git commit -m 'chore: update RSS seen state [skip ci]'
            git push
          fi
